name: 3D Contribution Stadium 🏟️

on:
  schedule:
    - cron: "0 18 * * *"     # Runs daily at 18:00 UTC (23:30 IST)
  workflow_dispatch:          # Allows manual trigger from Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contribution
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git commit -m "chore(telemetry): update 3d contribution stadium"; then
            git push
          fi

