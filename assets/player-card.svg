<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10"/>
      <stop offset="50%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>

    <!-- Holographic Gold-Red Gradient -->
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="25%" stop-color="#D31427"/>
      <stop offset="50%" stop-color="#F5CE7A"/>
      <stop offset="75%" stop-color="#D31427"/>
      <stop offset="100%" stop-color="#E2B755"/>
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="100%" stop-color="#FFF2CE"/>
    </linearGradient>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.04"/>
      <circle cx="10" cy="10" r="0.5" fill="#E2B755" fill-opacity="0.08"/>
    </pattern>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .id-head { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
      .id-mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes barcodeScan {
        0%, 100% { transform: translateY(0); opacity: 0.3; }
        50% { transform: translateY(110px); opacity: 0.8; }
      }
      .scanner-beam {
        animation: barcodeScan 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="480" rx="16" fill="url(#cardBg)"/>
  <rect width="1200" height="480" rx="16" fill="url(#cardGrid)"/>
  <rect x="12" y="12" width="1176" height="456" rx="12" fill="none" stroke="url(#holoBorder)" stroke-width="1.5" stroke-dasharray="14 8"/>

  <!-- Left Side: Player Credential Crest & Avatar Frame -->
  <g transform="translate(48, 50)">
    <!-- Avatar / Shield Box -->
    <rect width="280" height="380" rx="12" fill="#0C0F17" stroke="#222B3D" stroke-width="1.2"/>
    <rect x="0" y="0" width="280" height="4" rx="2" fill="#D31427"/>
    
    <!-- Watermark Monogram Crest -->
    <g transform="translate(40, 50)">
      <circle cx="100" cy="100" r="85" fill="#141926" stroke="#E2B755" stroke-width="1" stroke-dasharray="6 4" opacity="0.6"/>
      <circle cx="100" cy="100" r="70" fill="#180C11" stroke="#D31427" stroke-width="1.5"/>
      <text x="100" y="118" text-anchor="middle" fill="url(#goldSheen)" class="id-head" font-size="52" font-weight="900" letter-spacing="2">VM</text>
    </g>

    <!-- Player Details Badge -->
    <g transform="translate(24, 270)">
      <rect width="232" height="36" rx="6" fill="#161C2A" stroke="#263147" stroke-width="1"/>
      <text x="16" y="23" fill="#E2B755" class="id-mono" font-size="11" font-weight="800" letter-spacing="2">CAP NO: #01 // PROD</text>
      <circle cx="212" cy="18" r="4" fill="#00E676"/>
    </g>

    <g transform="translate(24, 320)">
      <text x="0" y="14" fill="#64748B" class="id-mono" font-size="9" font-weight="700" letter-spacing="1.5">CLEARANCE LEVEL</text>
      <text x="0" y="32" fill="#FFFFFF" class="id-mono" font-size="12" font-weight="800">SYSTEMS ARCHITECT // L6</text>
    </g>
  </g>

  <!-- Right Side: Official Player Registration Dossier -->
  <g transform="translate(365, 50)">
    <!-- Header Badge -->
    <rect width="180" height="26" rx="4" fill="#1F1117" stroke="#D31427" stroke-width="1"/>
    <text x="14" y="17" fill="#FF4D61" class="id-mono" font-size="10" font-weight="800" letter-spacing="2">OFFICIAL DOSSIER</text>
    <text x="560" y="18" fill="#5A667E" class="id-mono" font-size="11">MATCH VENUE: PRODUCTION CLOUD</text>

    <!-- Name & Title -->
    <text x="0" y="70" fill="#FFFFFF" class="id-head" font-size="34">VANDAN MAHAJAN</text>
    <text x="0" y="96" fill="#E2B755" class="id-mono" font-size="14" font-weight="700" letter-spacing="2">
      ROLE: SOFTWARE ENGINEER · SYSTEMS × PRODUCT × AI
    </text>

    <!-- Divider -->
    <line x1="0" y1="115" x2="780" y2="115" stroke="#1F283B" stroke-width="1"/>

    <!-- 4 Field Attributes Table -->
    <!-- Attrib 1 -->
    <g transform="translate(0, 135)">
      <rect width="375" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" font-weight="700" letter-spacing="1.5">CORE DISCIPLINE</text>
      <text x="18" y="48" fill="#FFFFFF" class="id-mono" font-size="13" font-weight="800">Java · Distributed Systems · Concurrency</text>
      <path d="M 0 0 L 0 68" stroke="#D31427" stroke-width="3"/>
    </g>

    <!-- Attrib 2 -->
    <g transform="translate(400, 135)">
      <rect width="380" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" font-weight="700" letter-spacing="1.5">INTELLIGENCE SUITE</text>
      <text x="18" y="48" fill="#FFFFFF" class="id-mono" font-size="13" font-weight="800">Hybrid RAG · Vector DBs · Local LLMs</text>
      <path d="M 0 0 L 0 68" stroke="#E2B755" stroke-width="3"/>
    </g>

    <!-- Attrib 3 -->
    <g transform="translate(0, 220)">
      <rect width="375" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" font-weight="700" letter-spacing="1.5">PLAYING PHILOSOPHY</text>
      <text x="18" y="48" fill="#E2B755" class="id-mono" font-size="13" font-weight="800">Logic × Common Sense × First Principles</text>
      <path d="M 0 0 L 0 68" stroke="#E2B755" stroke-width="3"/>
    </g>

    <!-- Attrib 4 -->
    <g transform="translate(400, 220)">
      <rect width="380" height="68" rx="8" fill="#0D111A" stroke="#1D2436" stroke-width="1"/>
      <text x="18" y="24" fill="#64748B" class="id-mono" font-size="10" font-weight="700" letter-spacing="1.5">PRODUCTION FORM</text>
      <text x="18" y="48" fill="#00E676" class="id-mono" font-size="13" font-weight="800">99.99% Uptime · p99 &lt; 42ms · 0 Bloat</text>
      <path d="M 0 0 L 0 68" stroke="#00E676" stroke-width="3"/>
    </g>

    <!-- Digital Barcode / Telemetry Signature -->
    <g transform="translate(0, 310)">
      <rect width="780" height="70" rx="8" fill="#090C12" stroke="#181F2E" stroke-width="1"/>
      
      <!-- Faux Barcode Lines -->
      <g transform="translate(24, 18)" fill="#E2B755" opacity="0.8">
        <rect x="0" y="0" width="3" height="34"/>
        <rect x="5" y="0" width="1" height="34"/>
        <rect x="8" y="0" width="4" height="34"/>
        <rect x="14" y="0" width="2" height="34"/>
        <rect x="18" y="0" width="5" height="34"/>
        <rect x="25" y="0" width="2" height="34"/>
        <rect x="29" y="0" width="1" height="34"/>
        <rect x="33" y="0" width="4" height="34"/>
        <rect x="40" y="0" width="2" height="34"/>
        <rect x="44" y="0" width="5" height="34"/>
        <rect x="52" y="0" width="2" height="34"/>
        <rect x="56" y="0" width="3" height="34"/>
        <rect x="62" y="0" width="1" height="34"/>
        <rect x="65" y="0" width="6" height="34"/>
        <rect x="73" y="0" width="2" height="34"/>
        <rect x="78" y="0" width="3" height="34"/>
        <rect x="83" y="0" width="1" height="34"/>
        <rect x="86" y="0" width="4" height="34"/>
        <rect x="93" y="0" width="2" height="34"/>
        <rect x="98" y="0" width="5" height="34"/>
        <rect x="106" y="0" width="2" height="34"/>
        <rect x="110" y="0" width="4" height="34"/>
      </g>

      <!-- Signature Hash & Credentials -->
      <text x="160" y="32" fill="#718096" class="id-mono" font-size="10" font-weight="700">HASH // SHA-256: 8A7F4B92C1D0E39F...VERIFIED</text>
      <text x="160" y="48" fill="#CBD5E1" class="id-mono" font-size="11">ISSUED BY: ENGINEERING GOVERNANCE · BENGALURU NODE</text>
      
      <!-- Right Stamp -->
      <g transform="translate(640, 16)">
        <rect width="115" height="38" rx="4" fill="#1C0D12" stroke="#D31427" stroke-width="1.2"/>
        <text x="57" y="24" text-anchor="middle" fill="#FF4D61" class="id-mono" font-size="11" font-weight="800" letter-spacing="1">PLAY BOLD</text>
      </g>
    </g>
  </g>
</svg>
