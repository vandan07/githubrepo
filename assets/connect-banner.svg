<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F"/>
      <stop offset="50%" stop-color="#140E15"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>

    <linearGradient id="connGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="100%" stop-color="#FFF2CE"/>
    </linearGradient>

    <linearGradient id="connRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D31427"/>
      <stop offset="100%" stop-color="#FF384D"/>
    </linearGradient>

    <pattern id="connGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .conn-head { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
      .conn-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <rect width="1200" height="280" rx="14" fill="url(#connBg)"/>
  <rect width="1200" height="280" rx="14" fill="url(#connGrid)"/>
  <rect x="12" y="12" width="1176" height="256" rx="10" fill="none" stroke="#2B1822" stroke-width="1.2"/>
  <rect x="16" y="16" width="1168" height="248" rx="8" fill="none" stroke="#E2B755" stroke-width="0.8" stroke-dasharray="8 6" opacity="0.3"/>

  <!-- Left Accent Ribbon -->
  <path d="M 12 40 L 12 240" stroke="url(#connRed)" stroke-width="4"/>

  <!-- Content Group -->
  <g transform="translate(60, 65)">
    <rect width="160" height="24" rx="4" fill="#1C0D12" stroke="#D31427" stroke-width="1"/>
    <text x="12" y="16" fill="#FF4D61" class="conn-mono" font-size="10" font-weight="800" letter-spacing="2">THE PAVILION</text>
    
    <text x="0" y="65" fill="#FFFFFF" class="conn-head" font-size="32">Let's Build Systems That Scale Boldly.</text>
    <text x="0" y="96" fill="#A0AEC0" class="conn-mono" font-size="13">
      Always excited to collaborate on distributed systems, high-throughput Java architecture, and production GenAI pipelines.
    </text>

    <!-- Location & Credo Footer -->
    <g transform="translate(0, 130)">
      <text x="0" y="0" fill="#E2B755" class="conn-mono" font-size="12" font-weight="800" letter-spacing="1">
        BENGALURU, INDIA · 12.9784° N, 77.5994° E · PLAY BOLD. THINK FIRST.
      </text>
    </g>
  </g>

  <!-- Right Side Decorative Crest Mark -->
  <g transform="translate(980, 50)" opacity="0.8">
    <circle cx="90" cy="90" r="75" fill="#150F16" stroke="#D31427" stroke-width="1.5" stroke-dasharray="6 4"/>
    <circle cx="90" cy="90" r="58" fill="#0C0E14" stroke="#E2B755" stroke-width="1"/>
    <text x="90" y="98" text-anchor="middle" fill="url(#connGold)" class="conn-head" font-size="32" font-weight="900">RC</text>
    <text x="90" y="116" text-anchor="middle" fill="#E2B755" class="conn-mono" font-size="8" font-weight="800" letter-spacing="2">BENGALURU</text>
  </g>
</svg>
