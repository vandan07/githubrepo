<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="scoreBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="60%" stop-color="#0A0E16"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <linearGradient id="goldLed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <linearGradient id="crimsonLed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D31427"/>
      <stop offset="100%" stop-color="#FF384D"/>
    </linearGradient>

    <pattern id="ledGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .score-head { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; }
      .score-mono { font-family: 'JetBrains Mono', monospace; }
      
      @keyframes blinkDigit {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.65; }
      }
      .live-blink {
        animation: blinkDigit 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect width="1200" height="300" rx="14" fill="url(#scoreBg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#ledGrid)"/>
  <rect x="10" y="10" width="1180" height="280" rx="10" fill="none" stroke="#222B3D" stroke-width="1.2"/>
  <rect x="14" y="14" width="1172" height="272" rx="8" fill="none" stroke="#D31427" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Top Ribbon -->
  <g transform="translate(36, 36)">
    <rect width="10" height="10" fill="#D31427"/>
    <text x="20" y="9" fill="#E2B755" class="score-mono" font-size="11" font-weight="800" letter-spacing="3">
      MATCH TELEMETRY &amp; LIVE ENGINEERING SCORECARD
    </text>
    <text x="960" y="9" fill="#718096" class="score-mono" font-size="10" font-weight="700" letter-spacing="2">
      VENUE: PROD CLUSTERS
    </text>
  </g>

  <!-- 4 Scorecard Metric Boxes -->
  <!-- BOX 1: SYSTEM AVAILABILITY -->
  <g transform="translate(36, 70)">
    <rect width="265" height="180" rx="6" fill="#0C1018" stroke="#1E2638" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="url(#crimsonLed)"/>
    <g transform="translate(20, 28)">
      <text x="0" y="0" fill="#718096" class="score-mono" font-size="10" font-weight="700" letter-spacing="1.5">WICKETS IN HAND // RESILIENCE</text>
      <text x="0" y="44" fill="url(#goldLed)" class="score-mono live-blink" font-size="34" font-weight="800">99.99%</text>
      <text x="0" y="74" fill="#A0AEC0" class="score-mono" font-size="11">Production System Uptime</text>
      <line x1="0" y1="92" x2="225" y2="92" stroke="#1E2638" stroke-width="1"/>
      <text x="0" y="112" fill="#E2B755" class="score-mono" font-size="10" font-weight="700">FAULT-TOLERANT ARCHITECTURE</text>
    </g>
  </g>

  <!-- BOX 2: LATENCY PROFILE -->
  <g transform="translate(325, 70)">
    <rect width="265" height="180" rx="6" fill="#0C1018" stroke="#1E2638" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="#E2B755"/>
    <g transform="translate(20, 28)">
      <text x="0" y="0" fill="#718096" class="score-mono" font-size="10" font-weight="700" letter-spacing="1.5">ECONOMY RATE // LATENCY</text>
      <text x="0" y="44" fill="#FFFFFF" class="score-mono" font-size="34" font-weight="800">&lt; 42ms</text>
      <text x="0" y="74" fill="#A0AEC0" class="score-mono" font-size="11">p99 Service Response Time</text>
      <line x1="0" y1="92" x2="225" y2="92" stroke="#1E2638" stroke-width="1"/>
      <text x="0" y="112" fill="#00E676" class="score-mono" font-size="10" font-weight="700">REDIS CACHE + INDEX TUNING</text>
    </g>
  </g>

  <!-- BOX 3: VELOCITY / THROUGHPUT -->
  <g transform="translate(614, 70)">
    <rect width="265" height="180" rx="6" fill="#0C1018" stroke="#1E2638" stroke-width="1"/>
    <rect x="0" y="0" width="265" height="3" fill="url(#crimsonLed)"/>
    <g transform="translate(20, 28)">
      <text x="0" y="0" fill="#718096" class="score-mono" font-size="10" font-weight="700" letter-spacing="1.5">STRIKE RATE // THROUGHPUT</text>
      <text x="0" y="44" fill="url(#goldLed)" class="score-mono" font-size="34" font-weight="800">5,000+</text>
      <text x="0" y="74" fill="#A0AEC0" class="score-mono" font-size="11">Events/sec Ingestion Rate</text>
      <line x1="0" y1="92" x2="225" y2="92" stroke="#1E2638" stroke-width="1"/>
      <text x="0" y="112" fill="#E2B755" class="score-mono" font-size="10" font-weight="700">KAFKA PARTITIONED TOPICS</text>
    </g>
  </g>

  <!-- BOX 4: CONTEXT EFFICIENCY -->
  <g transform="translate(903, 70)">
    <rect width="261" height="180" rx="6" fill="#140A0F" stroke="#3D1822" stroke-width="1"/>
    <rect x="0" y="0" width="261" height="3" fill="url(#crimsonLed)"/>
    <g transform="translate(20, 28)">
      <text x="0" y="0" fill="#D31427" class="score-mono" font-size="10" font-weight="700" letter-spacing="1.5">GENAI // RAG SPEEDUP</text>
      <text x="0" y="44" fill="#FF4D61" class="score-mono" font-size="34" font-weight="800">15s → 0.9s</text>
      <text x="0" y="74" fill="#CBD5E1" class="score-mono" font-size="11">Semantic Query Retrieval</text>
      <line x1="0" y1="92" x2="221" y2="92" stroke="#3D1822" stroke-width="1"/>
      <text x="0" y="112" fill="#00E676" class="score-mono" font-size="10" font-weight="700">94% CONTEXT PRECISION</text>
    </g>
  </g>
</svg>

