<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Dark Stadium Canvas Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="45%" stop-color="#0E1118"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>

    <!-- RCB Signature Crimson Gradient -->
    <linearGradient id="rcbRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D31427"/>
      <stop offset="50%" stop-color="#E82235"/>
      <stop offset="100%" stop-color="#FF3A4C"/>
    </linearGradient>

    <!-- Royal Gold Accents -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="50%" stop-color="#F5CE7A"/>
      <stop offset="100%" stop-color="#C99832"/>
    </linearGradient>

    <linearGradient id="goldHaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2B755" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D31427" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Carbon Mesh Pattern -->
    <pattern id="stadiumGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03"/>
      <circle cx="15" cy="15" r="0.8" fill="#E2B755" fill-opacity="0.08"/>
    </pattern>

    <!-- Glowing Filters -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=JetBrains+Mono:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');

      .font-display { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }
      .font-serif { font-family: 'Cinzel', Georgia, serif; font-weight: 700; }

      /* Keyframe Animations */
      @keyframes stadiumPulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.04); }
      }

      @keyframes seamTrace {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes statusBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @keyframes textCycle {
        0%, 20% { opacity: 1; transform: translateY(0); }
        25%, 95% { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .pulse-floodlight {
        transform-origin: 90% 10%;
        animation: stadiumPulse 6s ease-in-out infinite;
      }

      .pulse-floodlight-left {
        transform-origin: 10% 90%;
        animation: stadiumPulse 8s ease-in-out infinite 2s;
      }

      .crease-line {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: seamTrace 3s ease-out forwards;
      }

      .status-dot {
        animation: statusBlink 1.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Plate -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" rx="16" fill="url(#stadiumGrid)"/>

  <!-- Stadium Floodlight Beams -->
  <circle cx="1080" cy="40" r="280" fill="#D31427" opacity="0.22" filter="url(#crimsonGlow)" class="pulse-floodlight"/>
  <circle cx="120" cy="400" r="220" fill="#E2B755" opacity="0.12" filter="url(#goldGlow)" class="pulse-floodlight-left"/>

  <!-- Outer Architectural Framing (Carbon & Gold Trim) -->
  <rect x="16" y="16" width="1168" height="408" rx="12" fill="none" stroke="#252A36" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="402" rx="10" fill="none" stroke="url(#goldHaze)" stroke-width="0.8" stroke-dasharray="8 6"/>

  <!-- Match Status Capsule / Telemetry Header -->
  <g transform="translate(48, 52)">
    <rect width="280" height="34" rx="17" fill="#141822" stroke="#2D3344" stroke-width="1"/>
    <!-- Live Status LED -->
    <circle cx="20" cy="17" r="5" fill="#00E676" class="status-dot"/>
    <text x="34" y="22" fill="#8E99B0" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">MATCH STATUS: <tspan fill="#00E676">IN THE MIDDLE</tspan></text>
  </g>

  <!-- Cap Specification & Location -->
  <g transform="translate(940, 52)">
    <rect width="212" height="34" rx="8" fill="#141822" stroke="#D31427" stroke-width="1" stroke-opacity="0.4"/>
    <text x="18" y="22" fill="#E2B755" class="font-mono" font-size="11" font-weight="700" letter-spacing="2">CAP: #01 // BLR (IN)</text>
  </g>

  <!-- Cricket Pitch Seam Line / Geometric Graphic on Right -->
  <g transform="translate(860, 110)">
    <!-- Crease Geometry -->
    <line x1="0" y1="120" x2="280" y2="120" stroke="#D31427" stroke-width="2" opacity="0.4"/>
    <line x1="140" y1="0" x2="140" y2="240" stroke="#E2B755" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
    <circle cx="140" cy="120" r="90" fill="none" stroke="#D31427" stroke-width="1" opacity="0.2"/>
    <circle cx="140" cy="120" r="110" fill="none" stroke="#E2B755" stroke-width="1" stroke-dasharray="12 8" opacity="0.25"/>
    
    <!-- Stadium Stumps / Sovereign Columns -->
    <g transform="translate(110, 45)" opacity="0.85">
      <rect x="0" y="0" width="10" height="150" rx="3" fill="url(#royalGold)"/>
      <rect x="25" y="0" width="10" height="150" rx="3" fill="url(#rcbRed)"/>
      <rect x="50" y="0" width="10" height="150" rx="3" fill="url(#royalGold)"/>
      <!-- Bails -->
      <rect x="-4" y="-8" width="32" height="5" rx="2" fill="url(#royalGold)"/>
      <rect x="32" y="-8" width="32" height="5" rx="2" fill="url(#royalGold)"/>
    </g>

    <!-- Radial Decorative Coordinates -->
    <text x="75" y="225" fill="#5A647A" class="font-mono" font-size="9" letter-spacing="3">12.9784° N · 77.5994° E</text>
    <text x="95" y="238" fill="#D31427" class="font-mono" font-size="9" font-weight="700" letter-spacing="2">M. CHINNASWAMY</text>
  </g>

  <!-- Primary Identity Title (VANDAN MAHAJAN) -->
  <g transform="translate(48, 160)">
    <text x="0" y="0" fill="#FFFFFF" class="font-display" font-size="52" letter-spacing="-0.5">
      VANDAN MAHAJAN
    </text>

    <!-- Identity Subtitle with Crimson & Gold Ribbon -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="4" height="24" fill="url(#rcbRed)"/>
      <text x="16" y="18" fill="url(#royalGold)" class="font-display" font-size="19" font-weight="800" letter-spacing="4">
        SOFTWARE ENGINEER · SYSTEMS × PRODUCT × AI
      </text>
    </g>

    <!-- Core Philosophy Statement Banner -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="760" height="64" rx="8" fill="#10141E" stroke="#1F2535" stroke-width="1.2"/>
      <path d="M 0 0 L 0 64" stroke="url(#rcbRed)" stroke-width="4"/>
      
      <!-- Monospace Philosophy Ticker -->
      <text x="24" y="27" fill="#E2B755" class="font-mono" font-size="11" font-weight="700" letter-spacing="2.5">
        FIRST-PRINCIPLES PLAYBOOK:
      </text>
      <text x="24" y="47" fill="#CBD5E1" class="font-mono" font-size="13" font-weight="600">
        READ THE PITCH <tspan fill="#D31427">→</tspan> ISOLATE CAUSE <tspan fill="#D31427">→</tspan> ARCHITECT CLEAN <tspan fill="#D31427">→</tspan> <tspan fill="#E2B755">EXECUTE BOLD</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Telemetry Badges / Match Highlights -->
  <g transform="translate(48, 350)">
    <!-- Metric Box 1: Core Stack -->
    <g transform="translate(0, 0)">
      <rect width="240" height="48" rx="6" fill="#0E121A" stroke="#222838" stroke-width="1"/>
      <text x="16" y="19" fill="#717D96" class="font-mono" font-size="9" font-weight="700" letter-spacing="1.5">PRIMARY DISCIPLINE</text>
      <text x="16" y="36" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">JAVA · DISTRIBUTED</text>
      <rect x="228" y="0" width="12" height="48" rx="0" fill="url(#rcbRed)" opacity="0.8"/>
    </g>

    <!-- Metric Box 2: Modern Edge -->
    <g transform="translate(256, 0)">
      <rect width="240" height="48" rx="6" fill="#0E121A" stroke="#222838" stroke-width="1"/>
      <text x="16" y="19" fill="#717D96" class="font-mono" font-size="9" font-weight="700" letter-spacing="1.5">INTELLIGENCE LAYER</text>
      <text x="16" y="36" fill="#FFFFFF" class="font-mono" font-size="12" font-weight="700">GENAI · RAG PIPELINES</text>
      <rect x="228" y="0" width="12" height="48" rx="0" fill="url(#royalGold)" opacity="0.8"/>
    </g>

    <!-- Metric Box 3: Mindset Formula -->
    <g transform="translate(512, 0)">
      <rect width="360" height="48" rx="6" fill="#0E121A" stroke="#222838" stroke-width="1"/>
      <text x="16" y="19" fill="#717D96" class="font-mono" font-size="9" font-weight="700" letter-spacing="1.5">CORE FORMULA</text>
      <text x="16" y="36" fill="#E2B755" class="font-mono" font-size="12" font-weight="700">LOGIC × REASONING × JUDGMENT</text>
    </g>

    <!-- Metric Box 4: Match Credo -->
    <g transform="translate(888, 0)">
      <rect width="216" height="48" rx="6" fill="#180C10" stroke="#D31427" stroke-width="1" stroke-opacity="0.6"/>
      <text x="16" y="19" fill="#D31427" class="font-mono" font-size="9" font-weight="800" letter-spacing="1.5">TACTICAL CREDO</text>
      <text x="16" y="36" fill="#FFFFFF" class="font-display" font-size="13" font-weight="900" letter-spacing="1">PLAY BOLD. THINK FIRST.</text>
    </g>
  </g>

  <!-- Accent Corner Marks -->
  <path d="M 28 40 L 28 28 L 40 28" stroke="url(#royalGold)" stroke-width="2" fill="none"/>
  <path d="M 1172 40 L 1172 28 L 1160 28" stroke="url(#rcbRed)" stroke-width="2" fill="none"/>
  <path d="M 28 400 L 28 412 L 40 412" stroke="url(#rcbRed)" stroke-width="2" fill="none"/>
  <path d="M 1172 400 L 1172 412 L 1160 412" stroke="url(#royalGold)" stroke-width="2" fill="none"/>
</svg>

